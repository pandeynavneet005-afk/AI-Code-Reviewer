services:
  - type: web
    name: ai-code-reviewer-backend
    runtime: node
    plan: free
    rootDir: BackEnd
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GOOGLE_GEMINI_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: CORS_ORIGIN
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 60
      - key: MAX_CODE_LENGTH
        value: 20000
      - key: LOG_LEVEL
        value: info
